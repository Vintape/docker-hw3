services:
  app:
    build: .
    environment:
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
